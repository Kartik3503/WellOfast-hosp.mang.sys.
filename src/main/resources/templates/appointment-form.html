<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New Appointment — WellOfast</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app"><button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div th:replace="~{fragments/sidebar :: sidebar(${user}, 'appointments')}"></div>
<main class="main fade-in">
  <div class="topbar"><div><h1>📅 Schedule Appointment</h1></div><a th:href="@{/appointments}" class="btn btn-outline">← Back</a></div>
  <div class="card" style="max-width:600px"><div class="card-body">
    <form th:action="@{/appointments/save}" th:object="${appointment}" method="post">
      <div class="form-group"><label>Patient Name <span class="req">*</span></label><input type="text" th:field="*{patientName}" class="form-control" required></div>
      <div class="form-group"><label>Doctor <span class="req">*</span></label><select th:field="*{doctorId}" class="form-control" required><option value="">Select Doctor</option><option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName + ' — ' + (d.specialization != null ? d.specialization : d.department)}"></option></select></div>
      <div class="form-row"><div class="form-group"><label>Date <span class="req">*</span></label><input type="date" th:field="*{date}" class="form-control" required></div>
      <div class="form-group"><label>Time <span class="req">*</span></label><input type="time" th:field="*{time}" class="form-control" required></div></div>
      <div class="form-group"><label>Type</label><select th:field="*{type}" class="form-control"><option value="">Select</option><option value="Checkup">Checkup</option><option value="Follow-up">Follow-up</option><option value="Surgery">Surgery</option><option value="Emergency">Emergency</option><option value="Consultation">Consultation</option></select></div>
      <div class="form-group"><label>Notes</label><textarea th:field="*{notes}" class="form-control" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary btn-lg" style="margin-top:.5rem">📅 Schedule Appointment</button>
    </form>
  </div></div>
</main></div></body></html>
