<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — WellOfast</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">W</div>
      <h1>WellOfast</h1>
      <p>Hospital Management System</p>
    </div>
    <div th:if="${param.error}" class="alert alert-danger">⚠️ Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-info">✅ Logged out successfully.</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="auth-card">
      <form th:action="@{/login}" method="post">
        <div class="form-group"><label>Username <span class="req">*</span></label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus></div>
        <div class="form-group"><label>Password <span class="req">*</span></label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:.5rem">Sign In →</button>
      </form>
    </div>
    <div class="auth-footer"><p>Don't have an account? <a th:href="@{/register}">Register here</a></p></div>
  </div>
</div>
</body></html>
