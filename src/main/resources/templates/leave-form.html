<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Apply Leave — WellOfast</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app"><button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div th:replace="~{fragments/sidebar :: sidebar(${user}, 'leaves')}"></div>
<main class="main fade-in">
  <div class="topbar"><div><h1>🌴 Apply for Leave</h1></div><a th:href="@{/leaves}" class="btn btn-outline">← Back</a></div>
  <div class="card" style="max-width:600px"><div class="card-body">
    <form th:action="@{/leaves/save}" th:object="${leaveRequest}" method="post">
      <div class="form-group"><label>Leave Type <span class="req">*</span></label><select th:field="*{leaveType}" class="form-control" required><option value="">Select</option><option value="Sick Leave">Sick Leave</option><option value="Casual Leave">Casual Leave</option><option value="Earned Leave">Earned Leave</option><option value="Maternity Leave">Maternity Leave</option><option value="Paternity Leave">Paternity Leave</option><option value="Emergency Leave">Emergency Leave</option></select></div>
      <div class="form-row"><div class="form-group"><label>From Date <span class="req">*</span></label><input type="date" th:field="*{fromDate}" class="form-control" required></div>
      <div class="form-group"><label>To Date <span class="req">*</span></label><input type="date" th:field="*{toDate}" class="form-control" required></div></div>
      <div class="form-group"><label>Reason</label><textarea th:field="*{reason}" class="form-control" rows="3" placeholder="Reason for leave..."></textarea></div>
      <button type="submit" class="btn btn-primary btn-lg">📝 Submit Leave Request</button>
    </form>
  </div></div>
</main></div></body></html>
