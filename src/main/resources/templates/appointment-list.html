<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Appointments — WellOfast</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div class="app"><button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div th:replace="~{fragments/sidebar :: sidebar(${user}, 'appointments')}"></div>
<main class="main fade-in">
  <div class="topbar"><div><h1>📅 Appointments</h1></div><a th:href="@{/appointments/new}" class="btn btn-primary">+ New Appointment</a></div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div class="card"><table class="data-table"><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody><tr th:each="a : ${appointments}">
    <td th:text="${a.date}">Date</td><td th:text="${a.time}">Time</td>
    <td class="name" th:text="${a.patientName}">Patient</td><td th:text="${a.doctorName}">Doctor</td>
    <td th:text="${a.type ?: '-'}">Type</td>
    <td><span class="badge badge-green" th:if="${a.status=='SCHEDULED'}">Scheduled</span><span class="badge badge-blue" th:if="${a.status=='COMPLETED'}">Completed</span><span class="badge badge-red" th:if="${a.status=='CANCELLED'}">Cancelled</span></td>
    <td class="actions">
      <a th:if="${a.status=='SCHEDULED'}" th:href="@{/appointments/complete/{id}(id=${a.id})}" class="btn btn-success btn-sm">✓</a>
      <a th:if="${a.status=='SCHEDULED'}" th:href="@{/appointments/cancel/{id}(id=${a.id})}" class="btn btn-warning btn-sm">✕</a>
      <a th:href="@{/appointments/delete/{id}(id=${a.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">🗑️</a></td>
  </tr></tbody></table>
  <div th:if="${appointments.isEmpty()}" class="empty"><div class="empty-icon">📅</div><h3>No appointments</h3><a th:href="@{/appointments/new}" class="btn btn-primary">+ Schedule</a></div>
  </div>
</main></div></body></html>
