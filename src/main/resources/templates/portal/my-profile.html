<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Profile — WellOfast Patient Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
  <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div th:replace="~{fragments/patient-sidebar :: sidebar(${user}, 'profile')}"></div>
  <main class="main fade-in">
    <div class="topbar">
      <div><h1>👤 My Profile</h1>
      <div class="sub">Manage your personal information</div></div>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div style="display:grid;grid-template-columns:300px 1fr;gap:1.5rem">
      <!-- Profile Summary Card -->
      <div class="profile-card">
        <div class="profile-avatar" th:text="${user.fullName != null ? user.fullName.substring(0,1) : 'P'}">P</div>
        <div class="profile-name" th:text="${user.fullName}">Patient Name</div>
        <div class="profile-role">Patient</div>
        <div class="profile-info">
          <div class="p-row"><span class="p-label">Username</span><span class="p-val" th:text="${user.username}">user</span></div>
          <div class="p-row"><span class="p-label">Email</span><span class="p-val" th:text="${user.email != null ? user.email : '—'}">email</span></div>
          <div class="p-row"><span class="p-label">Phone</span><span class="p-val" th:text="${user.phone != null ? user.phone : '—'}">phone</span></div>
          <div class="p-row"><span class="p-label">Gender</span><span class="p-val" th:text="${user.gender != null ? user.gender : '—'}">gender</span></div>
          <div class="p-row"><span class="p-label">Member Since</span><span class="p-val" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd MMM yyyy') : '—'}">date</span></div>
        </div>
      </div>

      <!-- Edit Profile Form -->
      <div class="card">
        <div class="card-header"><h2>Edit Profile</h2></div>
        <div class="card-body">
          <form th:action="@{/portal/profile}" method="post">
            <div class="form-section"><h3>👤 Personal Information</h3></div>
            <div class="form-row">
              <div class="form-group"><label>Full Name <span class="req">*</span></label>
                <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required></div>
              <div class="form-group"><label>Email</label>
                <input type="email" name="email" class="form-control" th:value="${user.email}"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Phone</label>
                <input type="tel" name="phone" class="form-control" th:value="${user.phone}"></div>
              <div class="form-group"><label>Gender</label>
                <select name="gender" class="form-control">
                  <option value="">Select</option>
                  <option value="Male" th:selected="${user.gender == 'Male'}">Male</option>
                  <option value="Female" th:selected="${user.gender == 'Female'}">Female</option>
                  <option value="Other" th:selected="${user.gender == 'Other'}">Other</option>
                </select></div>
            </div>

            <div class="form-section"><h3>🏥 Medical Information</h3></div>
            <div class="form-row">
              <div class="form-group"><label>Blood Group</label>
                <select name="bloodGroup" class="form-control">
                  <option value="">Select</option>
                  <option value="A+">A+</option><option value="A-">A-</option>
                  <option value="B+">B+</option><option value="B-">B-</option>
                  <option value="AB+">AB+</option><option value="AB-">AB-</option>
                  <option value="O+">O+</option><option value="O-">O-</option>
                </select></div>
              <div class="form-group"><label>Emergency Contact</label>
                <input type="tel" name="emergencyContact" class="form-control" placeholder="Emergency contact number"></div>
            </div>
            <div class="form-group"><label>Known Allergies</label>
              <textarea name="allergies" class="form-control" rows="2" placeholder="List any known allergies..."></textarea></div>

            <div class="form-section"><h3>📍 Address</h3></div>
            <div class="form-group"><label>Address</label>
              <input type="text" name="address" class="form-control" th:value="${user.address}"></div>
            <div class="form-row">
              <div class="form-group"><label>City</label>
                <input type="text" name="city" class="form-control" th:value="${user.city}"></div>
              <div class="form-group"><label>State</label>
                <input type="text" name="state" class="form-control" th:value="${user.state}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="margin-top:1rem">💾 Save Profile</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
</body></html>
