<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messages — WellOfast Patient Portal</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
  <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div th:replace="~{fragments/patient-sidebar :: sidebar(${user}, 'chat')}"></div>
  <main class="main fade-in" style="padding:0;display:flex;flex-direction:column;height:100vh">
    <!-- Chat Layout -->
    <div class="chat-layout">
      <!-- Conversation List -->
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h3>💬 Messages</h3>
        </div>
        <!-- Start new chat with doctor -->
        <div th:if="${myDoctors != null and !myDoctors.isEmpty()}" class="chat-new-section">
          <select id="newChatSelect" class="form-control" style="font-size:.82rem">
            <option value="">Start new chat...</option>
            <option th:each="d : ${myDoctors}" th:value="${d.id}" th:text="${'Dr. ' + d.name}">Doctor</option>
          </select>
        </div>
        <div class="chat-conv-list">
          <div th:if="${conversations == null or conversations.isEmpty()}" class="chat-empty-conv">
            <p>No conversations yet</p>
            <small>Chat with your doctor after booking an appointment</small>
          </div>
          <a th:each="c : ${conversations}"
             th:href="@{/portal/chat/{id}(id=${c.otherUserId})}"
             class="chat-conv-item"
             th:classappend="${otherUser != null and otherUser.id == c.otherUserId ? 'active' : ''}">
            <div class="chat-conv-avatar" th:text="${#strings.substring(c.otherUserName,0,1)}">D</div>
            <div class="chat-conv-info">
              <div class="chat-conv-name">
                <strong th:text="${c.otherUserName}">Name</strong>
                <span class="chat-conv-time" th:text="${#temporals.format(c.lastTimestamp, 'HH:mm')}">12:00</span>
              </div>
              <div class="chat-conv-last">
                <span th:text="${#strings.length(c.lastMessage) > 40 ? #strings.substring(c.lastMessage,0,40) + '...' : c.lastMessage}">message</span>
                <span th:if="${c.unreadCount > 0}" class="chat-unread-badge" th:text="${c.unreadCount}">1</span>
              </div>
            </div>
          </a>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-main">
        <div th:if="${otherUser == null}" class="chat-no-selection">
          <div class="chat-no-icon">💬</div>
          <h3>Select a conversation</h3>
          <p>Choose a doctor to start chatting</p>
        </div>
        <div th:if="${otherUser != null}" class="chat-active">
          <div class="chat-header">
            <div class="chat-header-user">
              <div class="chat-header-avatar" th:text="${otherUser.fullName.substring(0,1)}">D</div>
              <div><strong th:text="${otherUser.fullName}">Doctor</strong>
                <span th:text="${otherUser.department}">Department</span></div>
            </div>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div th:if="${messages == null or messages.isEmpty()}" class="chat-start-msg">
              <p>👋 Start the conversation! Say hello to your doctor.</p>
            </div>
            <div th:each="msg : ${messages}" class="chat-message"
                 th:classappend="${msg.senderId == user.id ? 'sent' : 'received'}">
              <div class="msg-bubble">
                <div class="msg-text" th:text="${msg.message}">Hello</div>
                <div class="msg-time" th:text="${#temporals.format(msg.timestamp, 'HH:mm')}">12:00</div>
              </div>
            </div>
          </div>
          <div class="chat-input-area">
            <form id="chatForm" onsubmit="sendMessage(event)">
              <input type="hidden" id="receiverId" th:value="${otherUser.id}">
              <div class="chat-input-row">
                <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary">Send ➤</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
function sendMessage(e) {
    e.preventDefault();
    const receiverId = document.getElementById('receiverId').value;
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;
    fetch('/api/chat/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({receiverId, message})
    }).then(r => r.json()).then(msg => {
        const div = document.createElement('div');
        div.className = 'chat-message sent';
        div.innerHTML = `<div class="msg-bubble"><div class="msg-text">${msg.message}</div><div class="msg-time">${new Date(msg.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`;
        document.getElementById('chatMessages').appendChild(div);
        div.scrollIntoView({behavior:'smooth'});
        input.value = '';
    });
}
document.getElementById('newChatSelect')?.addEventListener('change', function() {
    if (this.value) window.location.href = '/portal/chat/' + this.value;
});
// Auto-scroll to bottom
document.getElementById('chatMessages')?.scrollTo(0, document.getElementById('chatMessages').scrollHeight);
</script>
</body></html>
