<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Consultation — WellOfast</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="app">
  <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <div th:replace="~{fragments/patient-sidebar :: sidebar(${user}, 'appointments')}"></div>
  <main class="main fade-in" style="padding:0;display:flex;flex-direction:column;height:100vh">
    <div class="topbar" style="padding:.75rem 1.5rem;flex-shrink:0">
      <div><h1>📹 Video Consultation</h1>
      <div class="sub">With <strong th:text="${appointment.doctorName}">Doctor</strong> — <span th:text="${appointment.department}">Dept</span></div></div>
      <a th:href="@{/portal/appointments}" class="btn btn-outline">← Back</a>
    </div>
    <div style="flex:1;position:relative;background:#0f0f0f">
      <div id="jitsi-container" style="width:100%;height:100%"></div>
    </div>
  </main>
</div>
<script src="https://meet.jit.si/external_api.js"></script>
<script th:inline="javascript">
const domain = 'meet.jit.si';
const options = {
    roomName: /*[[${roomName}]]*/ 'WellOfast-Room',
    width: '100%',
    height: '100%',
    parentNode: document.getElementById('jitsi-container'),
    userInfo: {
        displayName: /*[[${displayName}]]*/ 'Patient'
    },
    configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false
    },
    interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: ['microphone','camera','desktop','chat','raisehand','hangup','fullscreen','settings'],
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
        DEFAULT_BACKGROUND: '#0f172a'
    }
};
const api = new JitsiMeetExternalAPI(domain, options);
api.addEventListener('readyToClose', () => {
    window.location.href = '/portal/appointments';
});
</script>
</body></html>
