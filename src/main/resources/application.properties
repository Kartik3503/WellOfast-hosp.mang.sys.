# WellOfast Hospital Management System
spring.application.name=WellOfast
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/wellofast_db
spring.data.mongodb.database=wellofast_db

# Thymeleaf
spring.thymeleaf.cache=false

# Session
server.servlet.session.timeout=60m

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.wellofast=DEBUG
